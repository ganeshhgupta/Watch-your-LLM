services:
  - type: web
    name: watchyourllm-api
    env: python
    region: oregon
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard → paste NeonDB connection string
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app,http://localhost:5173
      - key: PYTHON_VERSION
        value: "3.11.0"
